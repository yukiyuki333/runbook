trigger:
  - main

# 定義 Runtime Parameters
parameters:
  - name: project_name
    displayName: '[create_project] 專案名稱 (Project Name)'
    type: string
    default: 'test_project'
  - name: repo_name
    displayName: '[create_project] 儲存庫名稱 (Repo Name)'
    type: string
    default: 'test_project'
  - name: pipeline_name
    displayName: '[create_project] 流水線名稱 (Pipeline Name)'
    type: string
    default: 'test_pipeline'
  - name: update_member_flag
    displayName: '[manage_membership] 更新成員標籤 (Update Member Flag)'
    type: string
    default: 'False'
  - name: email
    displayName: '[email]'
    type: string
    default: ''



pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.x'
  sonarCloudServiceConnection: 'SonarCloud'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install pytest pytest-cov jq
      python -m pip install requests
      python -m pip install git+https://github.com/yukiyuki333/ado_api_package.git
    displayName: 'Install dependencies'

  - task: SonarCloudPrepare@3
    displayName: 'Prepare SonarCloud Analysis'
    inputs:
      SonarCloud: '$(sonarCloudServiceConnection)'
      organization: '$(sonarCloudOrganization)'
      scannerMode: 'CLI'
      configMode: 'manual'
      cliProjectKey: '$(sonarProjectKey)'
      cliProjectName: '$(sonarProjectName)'

  - task: CmdLine@2
    displayName: 'Execute Runbook 1 & Runbook 2'
    env:
      org_name: $(ORG_NAME) 
      pat: $(PAT)           
    inputs:
      script: |
        echo "🚀 開始執行 Runbook 1..."
        python create_project.py --project_name "${{ parameters.project_name }}" --repo_name "${{ parameters.repo_name }}" --pipeline_name "${{ parameters.pipeline_name }}" --email "${{ parameters.email }}"
          
        echo "🚀 開始執行 Runbook 2..."
        python manage_membership.py --update_member_flag "${{ parameters.update_member_flag }}" --project_name "${{ parameters.project_name }}" --email "${{ parameters.email }}"
 
  - script: |
      python3 benchmark.py create_project.py -n 1
      if [ -f benchmark_summary.md ]; then
        echo "##vso[task.uploadsummary]$(pwd)/benchmark_summary.md"
      fi
    displayName: 'Performance Benchmarking (CPU, Memory, Time)'
    env:
      org_name: $(ORG_NAME)
      pat: $(PAT)
  
  - task: PublishTestResults@2
    displayName: 'Publish Test Results to Azure DevOps'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/test-results.xml'
      failTaskOnFailedTests: true
      testRunTitle: 'Python Tests'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish Code Coverage'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'

  - task: PublishTestResults@2
    displayName: 'Publish Performance Test Results'
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/perf-results.xml'
      testRunTitle: 'Performance Test Results'

  - task: SonarCloudAnalyze@3
    displayName: 'SonarCloudAnalyze'

  - task: SonarCloudPublish@3
    displayName: 'SonarCloudPublish'
    inputs:
      pollingTimeoutSec: '300'